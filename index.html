<style>
/* Layout: counter-top ledger. Slim ink sidebar, a cream thermal-paper receipt as the focal object, tabular figures everywhere. */
:root{
  --bg:#edf0ec; --surface:#fafbf8; --surface2:#e3e8e2; --ink:#16201b; --muted:#5b6a62; --line:#d0d8d0;
  --accent:#0e6b5b; --accent-ink:#ffffff; --accent-soft:#d3e9e2; --good:#1b7a43; --warn:#9a5a00; --bad:#b3261e;
  --side:#13231e; --side-ink:#d6e4de; --side-muted:#8ea79d; --side-on:#1f3a32;
  --paper:#fdfbf2; --paper-ink:#1b1b18; --shadow:0 1px 2px rgba(20,35,30,.08),0 8px 24px rgba(20,35,30,.08);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#161e1a; --surface2:#1e2823; --ink:#e6eee9; --muted:#97a89f; --line:#2a3731;
  --accent:#4cc3a9; --accent-ink:#04211a; --accent-soft:#183830; --good:#6fd39a; --warn:#e3a54c; --bad:#ff8f86;
  --side:#0a100d; --side-ink:#d6e4de; --side-muted:#7f978c; --side-on:#17302a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161e1a; --surface2:#1e2823; --ink:#e6eee9; --muted:#97a89f; --line:#2a3731;
  --accent:#4cc3a9; --accent-ink:#04211a; --accent-soft:#183830; --good:#6fd39a; --warn:#e3a54c; --bad:#ff8f86;
  --side:#0a100d; --side-ink:#d6e4de; --side-muted:#7f978c; --side-on:#17302a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.15rem} h3{font-size:1rem}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.mark{width:34px;height:34px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px;stroke:var(--accent-ink)}
.brand b{font:700 1.05rem var(--display);display:block}
.brand small{display:block;color:var(--side-muted);font-size:.78rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a:hover{background:var(--side-on)}
.nav a[aria-current="page"]{background:var(--side-on);box-shadow:inset 3px 0 0 var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:.8rem;color:var(--side-muted)}
.seg{display:flex;border:1px solid #2c4a40;border-radius:6px;overflow:hidden}
.seg{min-width:116px}
.seg button{flex:1;background:none;border:0;padding:6px 10px;color:var(--side-ink);cursor:pointer;font-weight:600;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.main{padding:28px 32px 56px;padding-right:max(32px,env(safe-area-inset-right,0px));min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;text-decoration:none;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.stat{padding:16px 18px}
.stat span{display:block;color:var(--muted);font-size:.82rem;font-weight:500}
.stat b{display:block;font:700 1.7rem var(--display);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hero span{color:inherit;opacity:.85}
.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.split{grid-template-columns:minmax(0,1fr) minmax(0,430px);align-items:start}
input[list]::-webkit-calendar-picker-indicator{display:none!important}
.banner{padding:10px 14px;border-radius:6px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));margin-bottom:16px;font-size:.92rem}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.mono{font-family:var(--mono);font-size:.86rem}

label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px;color:var(--ink);font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:64px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.items{display:flex;flex-direction:column;gap:8px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 78px 110px 100px 34px;gap:8px;align-items:center}
.irow .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ihead{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.2rem;line-height:1;border-radius:6px;height:34px}
.xbtn:hover{color:var(--bad);background:var(--surface2)}
.errs{color:var(--bad);font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 24px;justify-content:end;margin-left:auto;max-width:340px;font-variant-numeric:tabular-nums}
.totals .big{font:700 1.4rem var(--display);padding-top:6px;border-top:1px solid var(--line)}

/* thermal paper */
.papercol{position:sticky;top:20px;min-width:0}
.paperwrap{overflow-x:auto;padding:4px 2px 16px}
.paper{--cols:48;background:var(--paper);color:var(--paper-ink);width:calc(var(--cols)*1ch + 36px);padding:18px 18px 26px;font:12px/1.4 var(--mono);box-shadow:var(--shadow);margin:0 auto;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),97% 100%,94% calc(100% - 7px),91% 100%,88% calc(100% - 7px),85% 100%,82% calc(100% - 7px),79% 100%,76% calc(100% - 7px),73% 100%,70% calc(100% - 7px),67% 100%,64% calc(100% - 7px),61% 100%,58% calc(100% - 7px),55% 100%,52% calc(100% - 7px),49% 100%,46% calc(100% - 7px),43% 100%,40% calc(100% - 7px),37% 100%,34% calc(100% - 7px),31% 100%,28% calc(100% - 7px),25% 100%,22% calc(100% - 7px),19% 100%,16% calc(100% - 7px),13% 100%,10% calc(100% - 7px),7% 100%,4% calc(100% - 7px),1% 100%,0 calc(100% - 7px))}
.paper .ln{white-space:pre;min-height:1.4em}
.paper .ln.c{text-align:center}.paper .ln.r{text-align:right}
.paper .ln.b{font-weight:600}
.paper .ln.big{font-size:1.9em;line-height:1.2;min-height:0}
.paper img.logo{display:block;margin:0 auto 6px;max-width:100%;filter:grayscale(1) contrast(1.4)}
.papercap{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:8px}

.bars text{fill:var(--muted);font:11px var(--body)}
.bars .grid{stroke:var(--line);stroke-width:1}
.bars rect.b{fill:var(--accent)}
.bars rect.b.now{fill:var(--accent)}
.bars rect.b.old{fill:color-mix(in srgb,var(--accent) 55%,var(--surface))}
.meth{display:flex;flex-direction:column;gap:12px}
.meth .mrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:.9rem}
.meth .track{grid-column:1/-1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.meth .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.toolbar>*{min-width:0}
.toolbar label.f{flex:1 1 150px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.logo-prev{max-height:70px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important;font-weight:500!important}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:var(--shadow);z-index:50;max-width:min(92vw,520px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.hint{color:var(--muted);font-size:.85rem}
.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

#printRoot{display:none}
@media (max-width:980px){.two,.split{grid-template-columns:minmax(0,1fr)}.papercol{position:static}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;order:3;width:100%;gap:4px;padding-bottom:2px}
  .nav a{white-space:nowrap;padding:8px 10px}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}.side-foot .note{display:none}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
  h1{font-size:1.45rem}
  .irow{grid-template-columns:minmax(0,1fr) 64px 92px 28px}.irow .amt{display:none}.irow.ihead .amt{display:none}
}
@media print{
  #app,.toast{display:none!important}
  #printRoot{display:block!important}
  html,body{background:#fff!important;color:#000!important}
  #printRoot .paper{box-shadow:none;clip-path:none;margin:0;width:auto;padding:0 5mm;font-size:2.5mm;line-height:1.3}
  #printRoot .paper .ln.big{font-size:2em}
  #printRoot.a4{font:11pt/1.4 var(--body);color:#000}
  #printRoot.a4 table{font-size:10pt} #printRoot.a4 th,#printRoot.a4 td{border-bottom:1px solid #bbb;padding:4px 6px;color:#000}
  #printRoot.a4 h1{font-size:18pt;margin-bottom:4px} #printRoot.a4 h2{font-size:12pt;margin:16px 0 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

var port=null,usbDev=null,usbOut=null,usbName='';
function connected(){return port?'Serial port':usbDev?usbName:''}
async function connectPrinter(){
  var c=state.settings.conn;
  if(c==='serial'){if(!navigator.serial)throw new Error(t('x.noapi'));port=await navigator.serial.requestPort();await port.open({baudRate:+state.settings.baud||9600});usbDev=null}
  else if(c==='usb'){if(!navigator.usb)throw new Error(t('x.noapi'));var d=await navigator.usb.requestDevice({filters:[]});await d.open();if(!d.configuration)await d.selectConfiguration(1);
    var found=null;d.configuration.interfaces.forEach(function(itf){itf.alternates.forEach(function(alt){alt.endpoints.forEach(function(ep){if(ep.direction==='out'&&ep.type==='bulk'&&(!found||alt.interfaceClass===7))found={itf:itf.interfaceNumber,ep:ep.endpointNumber}})})});
    if(!found)throw new Error('No printer endpoint found');await d.claimInterface(found.itf);usbDev=d;usbOut=found.ep;usbName=(d.productName||'USB printer');port=null}
}

  var c=state.settings.conn;
  if(c==='serial'){if(!port)throw new Error(t('x.connect_first'));var w=port.writable.getWriter();try{for(var i=0;i<bytes.length;i+=512)await w.write(bytes.slice(i,i+512))}finally{w.releaseLock()}}
  else if(c==='usb'){if(!usbDev)throw new Error(t('x.connect_first'));for(var j=0;j<bytes.length;j+=4096)await usbDev.transferOut(usbOut,bytes.slice(j,j+4096))}
}

  return [rep.from||ref,rep.to||ref]}

  if(el.id==='savePrint'){saveReceipt(true);return}
  if(el.id==='clearBtn'){draft=blankDraft();newReceipt();return}
  var a=el.dataset.act,id=+el.dataset.id,r=id?state.receipts.filter(function(x){return x.id===id})[0]:null;
  if(a==='print'&&r)printReceipt(r).then(function(){if(location.hash==='#receipt-'+r.id)receiptDetail(r.id)});
  else if(a==='pdf'&&r){if(browserPrint(paperHTML(receiptLinesFor(r,false),colsFor(state.settings.paper)),receiptPageCss()))toast(t('x.dialog'))}
  else if(a==='bin'&&r){buildEscpos(receiptLinesFor(r,false),colsFor(state.settings.paper)).then(function(b){download(r.no+'.escpos.bin',b,'application/octet-stream')})}
  else if(a==='void'&&r){var reason=$('#void-r').value.trim();r.status='void';r.voidReason=reason||'-';r.voidTs=new Date().toISOString();save();toast(t('rcp.voided_toast'));route()}
  else if(a==='csv')download('report_'+range()[0]+'_'+range()[1]+'.csv',reportCSV(),'text/csv;charset=utf-8');
  else if(a==='reppdf'){if(browserPrint(reportPrintHTML(),'@page{size:A4;margin:14mm}','a4'))toast(t('x.dialog'))}
  else if(a==='prev'||a==='next'){var dir=a==='next'?1:-1,k=rep.kind;if(k==='daily')rep.ref=addDays(rep.ref,dir);else if(k==='weekly')rep.ref=addDays(rep.ref,7*dir);else{var d=parseYMD(rep.ref);rep.ref=ymd(new Date(d.getFullYear(),d.getMonth()+dir,1))}reportsView()}
  else if(a==='connect'){connectPrinter().then(function(){$('#connState').textContent=t('biz.connected',{n:connected()})}).catch(function(err){toast(t('x.fail',{e:err.message||err}),true)})}
  else if(a==='testprint')testPrint();
  else if(a==='rmlogo'){state.settings.logo='';save();businessView()}
  else if(a==='export')download('receipt-desk-backup-'+ymd(new Date())+'.json',JSON.stringify(state),'application/json');
  else if(a==='demo'||a==='wipe'){if(el.dataset.arm!=='1'){el.dataset.arm='1';el.textContent=t('biz.sure');return}
    if(a==='demo'){state.receipts=[];seedDemo(state)}else{state.receipts=[];state.counters={};state.nextId=1;state.demo=false}draft=null;save();location.hash='#dashboard';route()}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-open]')){e.preventDefault();location.hash='#receipt-'+e.target.dataset.open}});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.closest&&el.closest('#rform')&&draft){
    var row=el.closest('.irow');
    if(row&&el.dataset.k){draft.items[+row.dataset.i][el.dataset.k]=el.value;
      if(el.dataset.k==='name'&&!draft.items[+row.dataset.i].price){var h=lastPrice(el.value);if(h!=null){draft.items[+row.dataset.i].price=String(toMajor(h));$('#it-price-'+row.dataset.i).value=draft.items[+row.dataset.i].price}}}
    else{var map={'f-name':'name','f-phone':'phone','f-desc':'desc','f-disc':'discount','f-method':'method','f-ref':'ref','f-tend':'tendered','f-notes':'notes','f-lang':'lang'};if(map[el.id])draft[map[el.id]]=el.value;
      if(el.id==='f-name'&&!draft.phone){var p=phoneFor(el.value);if(p){draft.phone=p;$('#f-phone').value=p}}}
    refreshDraft();return}
  if(el.id==='h-q'||el.id==='h-from'||el.id==='h-to'||el.id==='h-st'){hist.q=$('#h-q').value;hist.from=$('#h-from').value;hist.to=$('#h-to').value;hist.status=$('#h-st').value;drawHist()}
});
function lastPrice(name){name=name.trim().toLowerCase();for(var i=state.receipts.length-1;i>=0;i--){var it=state.receipts[i].items.filter(function(x){return x.name.toLowerCase()===name})[0];if(it)return it.unit}return null}
function phoneFor(name){name=name.trim().toLowerCase();if(!name)return '';for(var i=state.receipts.length-1;i>=0;i--){var c=state.receipts[i].customer;if(c.name.toLowerCase()===name&&c.phone)return c.phone}return ''}
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='r-kind'){rep.kind=el.value;if(rep.kind==='custom'&&!rep.from){var r=range();rep.from=r[0];rep.to=r[1]}reportsView()}
  else if(el.id==='r-ref'&&el.value){rep.ref=el.value;reportsView()}
  else if((el.id==='r-from'||el.id==='r-to')&&$('#r-from').value&&$('#r-to').value){rep.from=$('#r-from').value;rep.to=$('#r-to').value;if(rep.to<rep.from)rep.to=rep.from;reportsView()}
  else if(el.id==='b-logo'&&el.files[0]){downscaleLogo(el.files[0]).then(function(u){state.settings.logo=u;save();businessView()}).catch(function(){toast(t('biz.bad_file'),true)})}
  else if(el.id==='b-import'&&el.files[0]){var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||!d.settings||!Array.isArray(d.receipts))throw 0;state=Object.assign(fresh(),d);state.settings=Object.assign({},DEF,d.settings);state.ui=Object.assign({lang:'en',theme:''},d.ui);save();applyTheme();toast(t('biz.restored'));location.hash='#dashboard';route()}catch(x){toast(t('biz.bad_file'),true)}};fr.readAsText(el.files[0])}
});
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='rform')saveReceipt(false);else if(e.target.id==='bform')saveBusiness()});
window.addEventListener('hashchange',route);
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',renderChrome)}catch(e){}
applyTheme();route();
})();
</script>

</body>
</html>
